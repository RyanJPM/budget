name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: if [ -f src/ui-a.js ]; then cat src/ui-a.js src/ui-b.js > src/ui.js; fi
      - run: if [ -f src/v130-css-a.patchpart ]; then cat src/v130-css-a.patchpart src/v130-css-b.patchpart > src/v130-css.patch; git apply src/v130-ui.patch src/v130-css.patch; fi
      - run: if [ -f src/v140-a1.patchpart ]; then cat src/v140-a1.patchpart src/v140-a2.patchpart src/v140-a3.patchpart src/v140-a4.patchpart > src/v140-a.patch; cat src/v140-b1.patchpart src/v140-b2.patchpart src/v140-b3.patchpart src/v140-b4.patchpart src/v140-b5.patchpart > src/v140-b.patch; git apply src/v140-a.patch src/v140-b.patch; fi
      - name: Polices
        run: |
          mkdir -p src/fonts
          base=https://cdn.jsdelivr.net/fontsource/fonts
          curl -fsSL -o src/fonts/plus-jakarta-sans.woff2 "$base/plus-jakarta-sans:vf@5.2.5/latin-wght-normal.woff2"
          curl -fsSL -o src/fonts/sora.woff2 "$base/sora:vf@5.2.5/latin-wght-normal.woff2"
          curl -fsSL -o src/fonts/outfit.woff2 "$base/outfit:vf@5.2.5/latin-wght-normal.woff2"
          curl -fsSL -o src/fonts/space-grotesk.woff2 "$base/space-grotesk:vf@5.2.5/latin-wght-normal.woff2"
          curl -fsSL -o src/fonts/syne.woff2 "$base/syne:vf@5.2.5/latin-wght-normal.woff2"
          curl -fsSL -o src/fonts/manrope.woff2 "$base/manrope:vf@5.2.5/latin-wght-normal.woff2"
          curl -fsSL -o src/fonts/OFL.txt https://raw.githubusercontent.com/google/fonts/main/ofl/manrope/OFL.txt
          python3 -c "open('src/fonts/NOTICE.txt','w').write('Plus Jakarta Sans, Sora, Outfit, Space Grotesk, Syne et Manrope sont sous la SIL Open Font License 1.1.\n')"
          test $(wc -c < src/fonts/plus-jakarta-sans.woff2) -gt 20000
          grep -q "Premier mois" src/ui.js
          grep -q "Investissements" src/ui.js
          grep -q 'id="findbar"' src/index.html
          grep -q 'data-theme="graphite"' src/styles.css
          if grep -q 'data-theme="papier"' src/styles.css; then exit 1; fi
      - run: npm ci
      - run: npm test
      - run: npm run dist:win
      - run: python3 scripts/pack-win.py dist/win-unpacked Budget-Setup.zip
      - uses: softprops/action-gh-release@v2
        with:
          files: Budget-Setup.zip
          generate_release_notes: false
          body: |
            Extrais Budget-Setup.zip, puis lance Budget.exe.
            L'application est vide. Importe ton fichier .budget depuis la page Profil.

            Un placement sort du compte sans être une dépense. Le total placé reste visible à part.
            Un prêt reçu entre le mois choisi et se rembourse ensuite.
            Ctrl+F, ou le bouton Chercher, cherche un mot sur la page.
