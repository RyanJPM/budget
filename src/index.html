<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Budget</title>
  <script>
    (function () {
      try {
        var look = JSON.parse(localStorage.getItem("budget-look") || "{}");
        var allowed = { default: 1, papier: 1, foret: 1, ocean: 1, atelier: 1 };
        var theme = allowed[look.theme] ? look.theme : "default";
        var mode = theme === "default" && look.mode === "dark" ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.mode = mode;
      } catch (e) {
        document.documentElement.dataset.theme = "default";
        document.documentElement.dataset.mode = "light";
      }
    })();
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside>
      <div class="brand">
        <svg viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="8" fill="#4F46E5"/>
          <circle cx="16" cy="16" r="9" fill="#fff"/>
          <circle cx="16" cy="16" r="4.5" fill="#4F46E5"/>
        </svg>
        <div>
          <strong>Budget</strong>
          <span>Sur cet ordinateur</span>
        </div>
      </div>
      <nav>
        <button type="button" data-page="now">Ce mois</button>
        <button type="button" data-page="spend">Dépenses</button>
        <button type="button" data-page="forecast">Prévision</button>
        <button type="button" data-page="history">Historique</button>
        <button type="button" data-page="settings">Réglages</button>
      </nav>
      <div class="side-foot">
        <span id="side-month"></span>
        <strong id="side-reste"></strong>
        <em>Le minimum reste à toi</em>
      </div>
    </aside>
    <main id="view"></main>
    <footer class="profile-dock">
      <label class="dock-id">
        <span>Profil</span>
        <select id="profile-select" aria-label="Choisir un profil"></select>
      </label>
      <div class="dock-tools">
        <button type="button" class="text-btn" id="mode-toggle" data-action="toggle-mode">Sombre</button>
        <button type="button" class="text-btn" data-action="open-design">Design</button>
        <button type="button" class="text-btn" data-page="profile" id="profile-manage">Gérer le profil</button>
      </div>
    </footer>
  </div>
  <div id="modal"></div>
  <script src="engine.js"></script>
  <script src="ui.js"></script>
</body>
</html>
